<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' mediastream: blob:">
  <title>StudioMix · Salida</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
    body.idle { cursor: none; }
    .hint {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      font: 13px "Segoe UI", system-ui, sans-serif; color: #e7eaf0; background: rgba(0, 0, 0, 0.7);
      padding: 6px 12px; border-radius: 6px; transition: opacity 0.3s; pointer-events: none;
    }
    body.idle .hint { opacity: 0; }
    .nosignal {
      position: fixed; inset: 0; display: grid; place-items: center;
      font: 600 20px "Segoe UI", system-ui, sans-serif; color: #8a93a4;
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <div id="nosignal" class="nosignal" hidden>Sin señal: StudioMix se ha cerrado</div>
  <div id="hint" class="hint">Esc o doble clic para cerrar esta salida</div>
  <script src="js/output.js"></script>
</body>
</html>
